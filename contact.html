<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="css/nav.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1f1c2c 0%, #3b2d6e 50%, #928dab 100%);
      color: white;
      min-height: 100vh;
    }
    a { color: #af5bfb; text-decoration: none; transition: color 0.3s; }
    a:hover { color: #d2a8ff; }

    .container {
      max-width: 700px;
      margin: 60px auto;
      padding: 40px;
      background: #2b2250;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.45);
      text-align: center;
      animation: fadeInUp 0.8s ease-out forwards;
    }

    .page-title {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 32px;
      padding: 12px 30px;
      background: #af5bfb;
      border-radius: 50px;
      display: inline-block;
      box-shadow: 0 0 18px #af5bfb;
    }

    .contact-list {
      list-style: none;
      padding: 0;
      font-size: 17px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .contact-list li {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(175,91,251,0.2);
      border-radius: 14px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: background 0.3s;
    }
    .contact-list li:hover {
      background: rgba(175,91,251,0.12);
    }
    .contact-list .icon {
      font-size: 22px;
      min-width: 28px;
    }
    .contact-list .label {
      font-size: 12px;
      color: #9b8ec4;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .contact-list .value { font-size: 15px; font-weight: 600; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

        </div>
      </li>

        </div>
      </li>
